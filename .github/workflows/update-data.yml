name: Mise à jour des données

# Chaque lundi à 06:17 UTC, et à la demande depuis l'onglet Actions.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Récupérer les sources de données
        run: |
          git clone --depth 1 https://github.com/imorte/passport-index-data.git /tmp/visa
          git clone --depth 1 https://github.com/database-of-embassies/database-of-embassies.git /tmp/embassies
          git clone --depth 1 https://github.com/davidmegginson/ourairports-data.git /tmp/airports

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruire les données
        run: |
          pip install pycountry
          python scripts/build_data.py --visa /tmp/visa --embassies /tmp/embassies --airports /tmp/airports --out data

      - name: Enregistrer les changements
        run: |
          # meta.json change à chaque exécution (date de construction) : on ne publie que si une vraie donnée a changé.
          if git diff --quiet -- data/visa.json data/embassies.json data/airports.json data/tz.json; then
            echo "Aucune donnée modifiée."
            exit 0
          fi
          sed -i "s/const CACHE = \"mdv-v[0-9]*\"/const CACHE = \"mdv-v$(date +%Y%m%d)\"/" sw.js
          git config user.name "mise-a-jour-donnees"
          git config user.email "actions@users.noreply.github.com"
          git add data sw.js
          git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          git push
